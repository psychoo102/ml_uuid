name: CMake Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: win32-release
            artifact_name: "ml_uuid-win32"
            extension: ".dll"

          - os: windows-latest
            preset: win64-release
            artifact_name: "ml_uuid-win64"
            extension: ".dll"

          - os: ubuntu-latest
            preset: linux-x64-release
            artifact_name: "ml_uuid-linux-x64"
            extension: ".so"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Linux deps
      - name: Install deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential liblua5.1-0-dev

      # Windows deps
      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja

      # vcpkg
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      # Configure via preset
      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      # Build via preset
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config Release

      - name: Test release packaging
        run: python -m unittest discover -s scripts -p "test_prepare_release.py"

      - name: Stage release binary
        run: python scripts/prepare_release.py stage "build/${{ matrix.preset }}" "${{ matrix.artifact_name }}${{ matrix.extension }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}${{ matrix.extension }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows x86 binary
        uses: actions/download-artifact@v4
        with:
          name: ml_uuid-win32
          path: release-assets

      - name: Download Windows x64 binary
        uses: actions/download-artifact@v4
        with:
          name: ml_uuid-win64
          path: release-assets

      - name: Download Linux x64 binary
        uses: actions/download-artifact@v4
        with:
          name: ml_uuid-linux-x64
          path: release-assets

      - name: Validate assets, package notices and calculate checksums
        run: python scripts/prepare_release.py finalize release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/ml_uuid-win32.dll
            release-assets/ml_uuid-win64.dll
            release-assets/ml_uuid-linux-x64.so
            release-assets/ml_uuid-notices.zip
            release-assets/SHA256SUMS
